<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة فحص وتشغيل بلايليست القنوات الذكية</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer" />

    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3159/3159073.png">

    <script src="//ssl.p.jwpcdn.com/player/v/8.26.0/jwplayer.js"></script>
    <script>jwplayer.key = "XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo";</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #141414;
            --header: #0d0d0d;
            --panel: #222222;
            --panel-2: #1a1a1a;
            --field: #111111;
            --border: #333333;
            --border-2: #3d3d3d;
            --text: #f5f5f5;
            --muted: #8a8a8a;
            --green: #22c55e;
            --green-dim: #4ade80;
            --blue: #0a84ff;
            --red: #ff5252;
            --btn: #374151;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: var(--bg); color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* ===== Header ===== */
        header {
            position: relative; flex-shrink: 0;
            background: var(--header); border-bottom: 2px solid var(--green);
            height: 62px; display: flex; align-items: center; justify-content: center; gap: 12px;
            font-size: 22px; font-weight: 700; color: var(--green);
        }
        header .bolt { color: #fb923c; font-size: 20px; }

        /* ===== Layout ===== */
        .wrap {
            flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px;
            width: 100%; max-width: 1000px; margin: 16px auto; padding: 0 0;
        }
        @media (max-width: 1040px) { .wrap { width: calc(100% - 24px); } }

        .card {
            flex-shrink: 0; background: var(--panel); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; box-shadow: 0 4px 14px rgba(0,0,0,.3);
        }

        #bulkInput {
            width: 100%; height: 96px; resize: none; display: block;
            background: #17291f; border: 1px dashed var(--green);
            border-radius: 6px; padding: 8px 10px; color: #d4d4d4;
            font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; outline: none;
        }
        #bulkInput::placeholder { color: #86d9a5; opacity: .75; }

        .btn-extract {
            width: 100%; height: 44px; margin-top: 10px; border: 0; border-radius: 6px;
            background: var(--blue); color: #fff; font-weight: 700; font-size: 13px;
            cursor: pointer; transition: filter .2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-extract:hover { filter: brightness(1.12); }

        .fields { display: flex; gap: 12px; margin-top: 16px; }
        .fields > * { flex: 1; min-width: 0; }
        .fields > .ua-wrap { flex: 0 0 42px; position: relative; }
        .gear {
            width: 42px; height: 42px; border-radius: 6px; border: 1px solid var(--border-2);
            background: var(--field); color: #aaa; cursor: pointer; font-size: 14px; transition: .2s;
        }
        .gear:hover { color: #fff; background: #2d2d2d; }
        .ua-pop {
            display: none; position: absolute; left: 0; top: 48px; z-index: 50; width: 440px; max-width: calc(100vw - 32px);
            background: var(--panel); border: 1px solid var(--border-2); border-radius: 8px; padding: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,.5); font-size: 11px; color: var(--muted); font-weight: 400;
        }
        .ua-pop.open { display: block; }
        .ua-pop label { display: block; margin-bottom: 6px; }
        #uaInput { height: 34px; font-size: 11px; color: var(--green-dim); }

        input[type=text] {
            height: 42px; width: 100%; background: var(--field);
            border: 1px solid var(--border-2); border-radius: 6px; color: #fff;
            padding: 0 14px; font-size: 13px; outline: none; transition: border-color .2s;
            font-family: ui-monospace, Consolas, monospace;
        }
        input[type=text]::placeholder { color: #6b6b6b; font-family: inherit; font-size: 12px; }
        input[type=text]:focus { border-color: var(--green); }

        /* ===== Actions row ===== */
        .actions { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; gap: 10px; }
        .group { display: flex; align-items: center; gap: 10px; }

        .btn {
            height: 39px; border-radius: 6px; border: 1px solid var(--border-2);
            background: #2b2b2b; color: #ddd; cursor: pointer; font-size: 12px; font-weight: 700;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: .2s;
            white-space: nowrap;
        }
        .btn:hover { background: #363636; }
        .btn:active { transform: scale(.97); }
        .btn-play { background: var(--green); border-color: var(--green); color: #04130a; padding: 0 28px; }
        .btn-play:hover { background: var(--green-dim); }
        .btn-clear { background: var(--red); border-color: var(--red); color: #fff; padding: 0 22px; }
        .btn-clear:hover { background: #ff6b6b; }
        .btn-sq { width: 42px; font-size: 10px; }

        .chip {
            height: 36px; padding: 0 10px; border-radius: 6px; background: transparent;
            border: 1px solid var(--border-2); color: #ccc; cursor: pointer; font-size: 12px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 8px; transition: .2s; opacity: .9;
        }
        .chip b {
            min-width: 22px; height: 22px; padding: 0 5px; border-radius: 4px; background: #343c4a; color: #fff;
            display: inline-flex; align-items: center; justify-content: center; font-size: 12px;
        }
        .chip:hover { opacity: 1; background: #2c2c2c; }
        .chip.active { color: var(--green); border-color: var(--green); opacity: 1; box-shadow: 0 0 0 1px var(--green) inset; }
        .chip.active b { background: var(--green); color: #04130a; }

        .btn-copy { height: 36px; padding: 0 12px; background: #374151; font-size: 13px; }
        .btn-copy svg { width: 15px; height: 15px; }

        .group-wrap { position: relative; display: flex; align-items: center; }
        .btn-split { width: 42px; height: 36px; color: #ccc; }
        .btn-split svg { width: 20px; height: 20px; }
        .btn-split.active, .btn-split.active:hover { background: #1a3a24; border-color: var(--green); color: var(--green); }

        .group-menu {
            display: none; position: fixed; z-index: 500; box-sizing: border-box; overflow-y: auto;
            background: #1c1c1c; border: 1px solid #444; border-radius: 8px; padding: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,.7);
        }
        .group-menu.open { display: block; }
        .gm-title { font-size: 11px; color: var(--green); padding: 6px 8px 4px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
        .gm-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 5px; cursor: pointer; font-size: 13px; }
        .gm-item:hover { background: #2c3a30; }
        .gm-item.sel { background: #1a3a24; outline: 1px solid var(--green); }
        .gm-label { flex: 1; min-width: 0; }
        .gm-item .count { flex-shrink: 0; min-width: 18px; text-align: center; background: #343c4a; border-radius: 4px; padding: 1px 8px; font-size: 12px; font-weight: bold; }

        /* ===== Bottom ===== */
        .bottom { flex: 1; display: flex; gap: 20px; min-height: 0; overflow: hidden; }

        .player-box {
            flex: 1; min-width: 0; position: relative; background: #000; border-radius: 10px;
            border: 1px solid var(--border); overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.4);
        }
        #playerContainer { width: 100%; height: 100%; }
        .overlay {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 20;
            display: flex; align-items: center; justify-content: space-between; pointer-events: none;
        }
        .overlay > * { pointer-events: auto; }
        .overlay-start { display: flex; align-items: center; gap: 8px; min-width: 0; }
        #activeChannelTitle {
            font-size: 12px; font-weight: 700; color: var(--green);
            max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            text-shadow: 0 1px 3px #000; transition: opacity .25s;
        }
        .badge {
            display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
            border-radius: 999px; font-size: 11px; font-weight: 700; border: 1px solid #3a3a3a;
            background: rgba(30,30,30,.9); color: #9ca3af; transition: .25s;
        }
        .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
        .badge.playing { background: rgba(34,197,94,.15); color: var(--green-dim); border-color: rgba(34,197,94,.4); }
        .badge.playing .dot { background: var(--green); animation: pulse 1.6s infinite; }
        .badge.loading { background: rgba(245,158,11,.15); color: #fbbf24; border-color: rgba(245,158,11,.4); }
        .badge.loading .dot { background: #f59e0b; animation: pulse .8s infinite; }
        .badge.error { background: rgba(255,82,82,.15); color: #ff8a8a; border-color: rgba(255,82,82,.4); }
        .badge.error .dot { background: var(--red); }
        @keyframes pulse { 50% { opacity: .3; } }

        .sidebar {
            width: 295px; flex-shrink: 0; background: var(--panel-2);
            border: 1px solid var(--border); border-radius: 10px; padding: 10px;
            display: flex; flex-direction: column; overflow: hidden; min-height: 0;
            transition: box-shadow .3s;
        }
        .sidebar.flash { box-shadow: 0 0 0 2px var(--green), 0 0 14px rgba(34,197,94,.5); }

        .pl-head { padding-bottom: 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .pl-row { display: flex; align-items: center; gap: 8px; min-height: 37px; }
        .pl-type {
            flex: 1; min-width: 0; font-size: 12px; font-weight: 700; color: #e2e8f0; line-height: 1.4;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .pl-prog { font-size: 11px; color: #fbbf24; flex-shrink: 0; white-space: nowrap; }
        .pl-search-btn {
            width: 37px; height: 37px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            background: var(--field); border: 1px solid var(--border-2); border-radius: 6px; color: #ccc; cursor: pointer; transition: .2s;
        }
        .pl-search-btn:hover { background: #2c2c2c; color: #fff; }
        .pl-search-btn.active { background: #1a3a24; border-color: var(--green); color: var(--green); }
        .pl-search-btn svg { width: 16px; height: 16px; }
        #searchInput { display: none; margin-top: 8px; height: 37px; font-size: 12px; padding: 0 12px; font-family: inherit; }

        #parsedList {
            flex: 1; min-height: 0; position: relative; overflow-y: auto; padding-top: 8px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .empty { margin: 28px auto 0; color: #6b6b6b; font-size: 12px; }

        .channel-card {
            flex-shrink: 0; height: 41px; padding: 0 8px 0 10px;
            background: var(--panel); border-radius: 6px; border-right: 3px solid transparent;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            cursor: pointer; color: #d9d9d9;
            transition: background-color .3s ease, color .3s ease, border-color .3s ease;
        }
        .channel-card:hover { background: #2a2a2a; }
        .channel-card.active { background: #173323; color: var(--green-dim); border-right-color: var(--green); font-weight: 700; }
        .ch-name { flex: 1; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ch-btns { display: flex; gap: 6px; flex-shrink: 0; }
        .ch-btns button {
            width: 30px; height: 26px; background: var(--btn); border: 0; color: #d1d5db;
            border-radius: 4px; cursor: pointer; font-size: 11px; transition: background .2s;
        }
        .ch-btns button:hover { background: #4b5563; color: #fff; }

        /* علامة نتيجة الفحص بجانب اسم القناة */
        .pbadge { display: inline-block; font-size: 10px; font-weight: bold; border-radius: 3px; padding: 0 4px; margin-inline-end: 4px; cursor: help; color: #000; background: #e67e22; }
        .pb-ok { background: #1dcf60; } .pb-hdr { background: #e67e22; }
        .pb-dead { background: #e74c3c; } .pb-key { background: #f1c40f; } .pb-net, .pb-other { background: #777; }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1dcf60; color: #000;
            padding: 10px 20px; border-radius: 6px; font-size: 13px; font-weight: bold; opacity: 0;
            transition: opacity .3s; z-index: 1000; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,.5);
        }
        #toast.toast-show { opacity: 1; }

        :root { color-scheme: dark; }
        * { scrollbar-width: thin; scrollbar-color: #454545 transparent; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #454545; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
        ::-webkit-scrollbar-thumb:hover { background: #5a5a5a; background-clip: padding-box; border: 2px solid transparent; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-corner { background: transparent; }

        /* ===== JW Player tweaks ===== */
        .jw-icon-playlist, .jw-icon-next, .jw-related-btn { display: none !important; }
        .jw-icon-fullscreen svg { display: none !important; }
        .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOCAzSDVhMiAyIDAgMCAwLTIgMnYzbTE4IDBWNWEyIDIgMCAwIDAtMi0yaC0zbTAgMThoM2EyIDIgMCAwIDAgMi0ydi0zTTMgMTZ2M2EyIDIgMCAwIDAgMiAyaDMiPjwvcGF0aD48L3N2Zz4=');
            background-size: 16px; background-position: center; background-repeat: no-repeat;
        }
        .jw-flag-fullscreen .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2Utam9pbj0icm91bmQiPjxwYXRoIGQ9Ik04IDN2M2EyIDIgMCAwIDEtMiAySDNtMTggMGgtM2EyIDIgMCAwIDEtMi0yVjNtMCAxOHYtM2EyIDIgMCAwIDEgMi0yaDNNMyAxNmgzYTIgMiAwIDAgMSAyIDJ2MyI+PC9wYXRoPjwvc3ZnPg==');
        }

        @media (max-width: 760px) {
            .fields { flex-wrap: wrap; }
            .fields > * { flex: 1 1 45%; }
            .actions { flex-direction: column; align-items: stretch; }
            .group { flex-wrap: wrap; justify-content: center; }
            html, body { height: auto; }
            body { overflow: auto; }
            .wrap { min-height: auto; }
            .bottom { flex-direction: column; overflow: visible; flex: none; }
            .player-box { height: 300px; flex: none; }
            .sidebar { width: 100%; height: 320px; }
        }
    </style>
</head>
<body>

    <header>
        <span>أداة فحص وتشغيل بلايليست القنوات الذكية</span>
        <i class="fa-solid fa-bolt bolt"></i>
    </header>

    <div class="wrap">

        <div class="card">
            <textarea id="bulkInput" placeholder="الصق محتوى الملف بالكامل هنا..."></textarea>
            <button class="btn-extract" onclick="parseAndLoadChannels()">
                استخراج وفصل القنوات تلقائياً <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>

            <div class="fields">
                <input type="text" id="singleUrl" placeholder="رابط القناة (URL)">
                <input type="text" id="singleK1" placeholder="Key ID (k1)">
                <input type="text" id="singleK2" placeholder="Key (k2)">
                <div class="ua-wrap">
                    <button class="gear" onclick="document.getElementById('uaPop').classList.toggle('open')" title="إعدادات User-Agent"><i class="fa-solid fa-gear"></i></button>
                    <div class="ua-pop" id="uaPop">
                        <label for="uaInput">User-Agent</label>
                        <input type="text" id="uaInput" value="Mozilla/5.0 (Smart-TV; Linux; Tizen 6.0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/85.0.4183.102 TV Safari/537.36" title="User-Agent">
                    </div>
                </div>
            </div>

            <div class="actions">
                <div class="group">
                    <button class="btn btn-play" id="playBtn" onclick="togglePlay()" title="تشغيل القناة المحددة / إيقافها إيقافاً تاماً">تشغيل/إيقاف ▶</button>
                    <button class="btn btn-clear" onclick="clearAll()">مسح الكل <i class="fa-solid fa-trash-can"></i></button>
                    <button class="btn btn-sq" onclick="navigateChannel(-1)" title="القناة السابقة"><i class="fa-solid fa-caret-up"></i></button>
                    <button class="btn btn-sq" onclick="navigateChannel(1)" title="القناة التالية"><i class="fa-solid fa-caret-down"></i></button>
                </div>
                <div class="group" style="gap:8px">
                    <button class="chip active" id="chipAll" data-filter="all" onclick="setFilter('all')">الكل <b id="cntAll">0</b></button>
                    <button class="btn btn-copy" id="copyShownBtn" onclick="copyShown()" title="نسخ أكواد القنوات المعروضة في مربع القنوات">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        <span id="listCount">0</span>
                    </button>
                    <div class="group-wrap" id="groupWrap">
                        <button class="btn btn-split" id="groupBtn" onclick="toggleGroupMenu(event)" title="تقسيم القنوات">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
                        </button>
                        <div class="group-menu" id="groupMenu" onclick="event.stopPropagation()"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom">
            <div class="player-box">
                <div class="overlay">
                    <div class="overlay-start">
                        <span id="statusBadge" class="badge"><span class="dot"></span> غير متصل</span>
                        <span id="activeChannelTitle"></span>
                    </div>
                </div>
                <div id="playerContainer">
                    <div id="jwplayerDiv" style="width:100%;height:100%;"></div>
                </div>
            </div>

            <aside class="sidebar" id="sidebar">
                <div class="pl-head">
                    <div class="pl-row">
                        <span class="pl-type" id="shownType"></span>
                        <span class="pl-prog" id="probeProg"></span>
                        <button class="pl-search-btn" id="searchBtn" onclick="toggleSearch()" title="بحث عن قناة">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        </button>
                    </div>
                    <input type="text" id="searchInput" placeholder="بحث عن قناة..." oninput="renderList()" onkeydown="if(event.key==='Escape')toggleSearch(false)">
                </div>
                <div id="parsedList"><div class="empty">لم يتم استخراج قنوات بعد</div></div>
            </aside>
        </div>
    </div>

    <div id="toast">تم النسخ بنجاح</div>

    <script>
        let currentPlayer = null;
        let playTimer = null;
        window.extractedChannelsList = [];
        let activeChannelIndex = -1;
        let currentFilter = 'all';
        let isPlaying = false;
        const $ = id => document.getElementById(id);
        let customUA = document.getElementById('uaInput').value;

        document.getElementById('uaInput').addEventListener('input', (e) => {
            customUA = e.target.value.trim();
        });

        (function() {
            var originalFetch = window.fetch;
            var originalXHR = window.XMLHttpRequest;
            window.fetch = function(url, options) {
                options = options || {}; options.headers = options.headers || {};
                options.headers['User-Agent'] = customUA;
                return originalFetch.call(this, url, options);
            };
            var XHROpen = originalXHR.prototype.open;
            originalXHR.prototype.open = function(method, url) {
                XHROpen.apply(this, arguments);
                try { this.setRequestHeader('User-Agent', customUA); } catch (e) {}
            };
        })();

        function showToast(msg) {
            const t = $('toast');
            t.innerText = msg; t.classList.add('toast-show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => t.classList.remove('toast-show'), 2600);
        }

        /* زر التشغيل/الإيقاف يتبع حالة المشغل */
        function syncPlayBtn(state) {
            isPlaying = (state === 'playing' || state === 'loading');
            $('playBtn').textContent = isPlaying ? 'تشغيل/إيقاف ⏹' : 'تشغيل/إيقاف ▶';
        }

        function setStatus(text, state) {
            const el = $('statusBadge');
            el.className = 'badge ' + (state || '');
            el.innerHTML = `<span class="dot"></span> ${text}`;
            syncPlayBtn(state);
        }

        function setTitle(text) {
            const el = $('activeChannelTitle');
            el.style.opacity = 0;
            setTimeout(() => { el.innerText = text; el.style.opacity = 1; }, 120);
        }

        function copyToClipboard(text, e = null) {
            if (e) e.stopPropagation();
            return navigator.clipboard.writeText(text)
                .then(() => showToast('تم النسخ بنجاح ✓'))
                .catch(() => showToast('تعذّر النسخ'));
        }

        function codeLine(ch) {
            return `{ id: "${ch.name}", name: "${ch.name}", url: "${ch.url}", k1: "${ch.k1}", k2: "${ch.k2}" }`;
        }

        function copyCodeLine(index, e) {
            e.stopPropagation();
            copyToClipboard(codeLine(window.extractedChannelsList[index]));
        }

        /* نسخ أكواد القنوات المعروضة حالياً فقط (بعد المجموعة والبحث) */
        function copyShown() {
            const list = getVisibleIndices().map(i => window.extractedChannelsList[i]);
            if (!list.length) { showToast('لا توجد قنوات لنسخها!'); return; }
            navigator.clipboard.writeText(list.map(codeLine).join(',\n'))
                .then(() => showToast(`تم نسخ ${list.length} قناة ✓`))
                .catch(() => showToast('تعذّر النسخ'));
        }

        /* إن اشتغلت قناة مصنّفة فاشلة فعلياً في المشغّل الرئيسي نصحّح تصنيفها فوراً */
        function markPlayable() {
            const ch = window.extractedChannelsList[activeChannelIndex];
            if (!ch || !ch.probe) return;
            if (ch.probe.s === 'ok') return;
            ch.probe = { s: 'ok', msg: '✅ اشتغلت فعلياً (صُحّح تصنيفها تلقائياً)' };

        /* ===== التشغيل: نفس المشغل يُعاد استخدامه عند التبديل ===== */

                currentPlayer.addButton(

                    function() {

                            if (videoEl) { videoEl.style.objectFit = 'fill'; videoEl.style.width = '100%'; videoEl.style.height = '100%'; }

                            if (videoEl) { videoEl.style.objectFit = 'contain'; }

            currentPlayer.on('play', () => setStatus('يعمل الآن', 'playing'));

            currentPlayer.on('audioTracks', function() {
                const tracks = currentPlayer.getAudioTracks() || [];
                tracks.forEach((track, index) => {
                    const label = (track.label || '').toLowerCase();
                    if (label.includes("ara") || (track.label || '').includes("عربي")) {

            currentPlayer.on('error', function() { setStatus('فشل التشغيل', 'error'); });

        function playStream(name, url, k1, k2) {
            if (!url) return;
            setTitle(name || 'رابط اختباري');
            setStatus('جاري التحميل...', 'loading');

            const item = { file: url };
            if (k1 && k2) item.drm = { clearkey: { keyId: k1, key: k2 } };

            if (currentPlayer) {
                currentPlayer.load([item]);
                currentPlayer.play(true);
            } else {
                setupJW(item);
            }
        }

        function destroyJW() {
            if (currentPlayer) { try { currentPlayer.remove(); } catch (e) {} currentPlayer = null; }
            ensurePlayerDiv();
        }

        /* إيقاف تام */
        function stopPlayer() {
            clearTimeout(playTimer);
            destroyJW();

            document.getElementById('activeChannelTitle').innerText = '';
        }

        function togglePlay() { isPlaying ? stopPlayer() : playSingleLink(); }

        function playSingleLink() {
            const url = document.getElementById('singleUrl').value.trim();
            const k1 = document.getElementById('singleK1').value.trim();
            const k2 = document.getElementById('singleK2').value.trim();
            const idx = window.extractedChannelsList.findIndex(c => c.url === url && c.k1 === k1);
            const known = idx > -1 ? window.extractedChannelsList[idx] : null;

            activeChannelIndex = idx;
            updateActiveChannelStyle();
            playStream(known ? known.name : 'اختبار سريّع', url, k1, k2);

        function playParsedChannel(index, alignTop = false) {
            activeChannelIndex = index;
            updateActiveChannelStyle(alignTop);

            const ch = window.extractedChannelsList[index];
            if (ch) {
                document.getElementById('singleUrl').value = ch.url || '';

        function updateActiveChannelStyle(alignTop = false, noScroll = false) {

            const bottom = card.offsetTop + card.offsetHeight + 8;
            if (alignTop) {
                list.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
            } else if (top < list.scrollTop) {
                list.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
            } else if (bottom > list.scrollTop + list.clientHeight) {
                list.scrollTo({ top: bottom - list.clientHeight, behavior: 'smooth' });

        /* ===== الصيغ ===== */
        function getType(url) {
            const low = (url || '').toLowerCase();
            const clean = low.split('?')[0];
            if (/\.mpd(\/|$)/.test(clean)) return 'mpd';
            if (/\.m3u8(\/|$)/.test(clean)) return 'm3u8';
            if (/\.ts$/.test(clean)) return 'ts';
            if (low.includes('.mpd')) return 'mpd';
            if (low.includes('.m3u8')) return 'm3u8';
            if (low.includes('.ts')) return 'ts';
            return 'other';
        }

        function updateCounts() {

        /* ================================================================
           الفحص: مرحلة واحدة بمشغّل JW (نفس مسار التشغيل العادي)
           ok = تعمل | hdr = مرفوضة (401/403/CORS) | dead = الرابط ميت
           key = خطأ DRM/شفرة | net = انتهت المهلة | other = غير معروف
           ================================================================ */
        const ICONS = { ok: '✅', hdr: '🌐', dead: '❌', key: '⚠', net: '❓', other: '❓' };

        function classifyJWError(e) {
            const c = String((e && e.code) || ''), m = String((e && e.message) || '');
            const has = n => c.endsWith(n) || new RegExp('(^|\\D)' + n + '(\\D|$)').test(m);
            if (has('401') || has('403') || has('407') || /forbidden|denied|cross.?domain|cors/i.test(m))
                return { s: 'hdr', msg: `🌐 مرفوضة (401/403/CORS)${c ? ' [' + c + ']' : ''}` };
            if (has('404') || has('410') || /not found|gone|\\b5\\d\\d\\b/i.test(m))
                return { s: 'dead', msg: `❌ الرابط ميت أو منتهي${c ? ' [' + c + ']' : ''}` };
            if (/drm|licen[sc]e|key|decrypt|encrypt|clearkey/i.test(m))
                return { s: 'key', msg: `⚠ خطأ DRM/شفرة${c ? ' [' + c + ']' : ''}` };
            return { s: 'other', msg: `❓ خطأ${c ? ' ' + c : ''} ${m}`.trim() };
        }

        /* تشغيل تجريبي صامت وخارج الشاشة: القناة شغالة إذا ظهر أول إطار */
        function probeChannel(ch, timeout = 14000) {
            return new Promise(resolve => {
                const id = 'jwProbe_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
                const holder = document.createElement('div');
                holder.setAttribute('aria-hidden', 'true');
                holder.style.cssText = 'position:fixed;left:-9999px;top:0;width:320px;height:180px;opacity:0;pointer-events:none';
                const inner = document.createElement('div'); inner.id = id;
                holder.appendChild(inner); document.body.appendChild(holder);

                let pl = null, done = false, timer;
                const finish = res => {
                    if (done) return; done = true; clearTimeout(timer);
                    try { if (pl) pl.remove(); } catch (e) {}
                    try { holder.remove(); } catch (e) {}
                    resolve(res);
                };
                const item = { file: ch.url };
                if (ch.k1 && ch.k2) item.drm = { clearkey: { keyId: ch.k1, key: ch.k2 } };
                try {
                    pl = jwplayer(id).setup({ playlist: [item], width: 320, height: 180, autostart: true, mute: true });
                } catch (e) { finish(classifyJWError(e)); return; }

                pl.on('firstFrame', () => finish({ s: 'ok', msg: '✅ تعمل' }));
                pl.on('time', e => { if (e && e.position > 0) finish({ s: 'ok', msg: '✅ تعمل' }); });
                pl.on('error', e => finish(classifyJWError(e)));
                pl.on('setupError', e => finish(classifyJWError(e)));
                timer = setTimeout(() => finish({ s: 'net', msg: '❓ انتهت المهلة: بطيئة أو ميتة' }), timeout);
            });
        }

        let probeToken = 0;
        async function probeAll() {
            const token = ++probeToken;                 // أي استخراج جديد أو مسح يلغي الفحص القديم
            const list = window.extractedChannelsList.slice(), queue = list.slice();
            const prog = $('probeProg');
            let done = 0;
            prog.textContent = `فحص 0/${list.length}`;
            const worker = async () => {
                while (queue.length && token === probeToken) {
                    const ch = queue.shift();
                    const r = await probeChannel(ch);
                    if (token !== probeToken || !r) return;
                    ch.probe = r;
                    done++; prog.textContent = `فحص ${done}/${list.length}`;
                    if (done % 4 === 0) renderList(true);
                }
            };
            await Promise.all([worker(), worker(), worker(), worker()]);
            if (token !== probeToken) { return; }
            prog.textContent = ''; renderList(true);
            const c = k => list.filter(x => x.probe && x.probe.s === k).length;
            showToast(`انتهى الفحص: ✅ ${c('ok')} | 🌐 ${c('hdr')} | ❌ ${c('dead')} | ⚠ ${c('key')} | ❓ ${c('net') + c('other')}`);
        }

        /* ===== مجموعات تقسيم القنوات ===== */
        const pr_ = c => c.probe && c.probe.s;
        const GROUPS = {
            mpd:   { label: 'MPD',          test: c => getType(c.url) === 'mpd' },
            m3u8:  { label: 'M3U8',         test: c => getType(c.url) === 'm3u8' },
            extra: { label: 'صيغ إضافية',   hint: 'TS وغيرها', test: c => ['ts', 'other'].includes(getType(c.url)) },
            bad:   { label: 'قنوات معطّلة', hint: 'ميتة / شفرة خاطئة', test: c => ['dead', 'key'].includes(pr_(c)) },
            ok:    { label: '✅ تعمل', test: c => pr_(c) === 'ok' },
            hdr:   { label: '🌐 مرفوضة (401 / 403)', test: c => pr_(c) === 'hdr' },
            dead:  { label: '❌ الرابط ميت', test: c => pr_(c) === 'dead' },
            key:   { label: '⚠ خطأ في الشفرة', test: c => pr_(c) === 'key' },
            net:   { label: '❓ انتهت المهلة', test: c => ['net', 'other'].includes(pr_(c)) }
        };
        const SECTIONS = [
            { title: 'حسب الصيغة', items: ['mpd', 'm3u8', 'extra', 'bad'] },
            { title: 'حسب نتيجة الفحص', items: ['ok', 'hdr', 'dead', 'key', 'net'] }
        ];

        function renderGroupMenu() {

                return `<div class="gm-item${currentFilter === g ? ' sel' : ''}" onclick="applyGroupFilter('${g}')" title="عرض قنوات هذه المجموعة في قائمة القنوات">
                    <span class="gm-label">${G.label}${hint}</span><span class="count">${n}</span></div>`;
            }).join('')).join('');

        }

        function placeGroupMenu() {

        function toggleGroupMenu(e) {

        function applyGroupFilter(g) {

        document.addEventListener('keydown', e => { if (e.key === 'Escape') $('groupMenu').classList.remove('open'); });
        window.addEventListener('resize', () => $('groupMenu').classList.remove('open'));
        document.addEventListener('click', () => $('groupMenu').classList.remove('open'));

        /* ===== الفلاتر والبحث والتنقل ===== */
        function setFilter(type) {
            currentFilter = (type !== 'all' && GROUPS[type]) ? type : 'all';
            renderList();
        }

        function getVisibleIndices() {
            const q = $('searchInput').value.trim().toLowerCase();
            const g = currentFilter !== 'all' ? GROUPS[currentFilter] : null;
            const out = [];
            window.extractedChannelsList.forEach((ch, i) => {
                if (g && !g.test(ch)) return;
                if (q && !ch.name.toLowerCase().includes(q)) return;
                out.push(i);
            });
            return out;
        }

        function navigateChannel(step) {
            const vis = getVisibleIndices();
            if (vis.length === 0) return;
            let pos = vis.indexOf(activeChannelIndex);
            if (pos === -1) pos = step > 0 ? -1 : vis.length;
            pos = (pos + step + vis.length) % vis.length;
            playParsedChannel(vis[pos], true);
        }

        function toggleSearch(force) {
            const inp = $('searchInput'), btn = $('searchBtn');
            const open = force !== undefined ? force : inp.style.display !== 'block';
            inp.style.display = open ? 'block' : 'none';

        function renderList(noScroll = false) {
            const listContainer = $('parsedList');
            const all = window.extractedChannelsList;
            const isGroup = currentFilter !== 'all' && !!GROUPS[currentFilter];

            $('chipAll').classList.toggle('active', !isGroup);
            $('groupBtn').classList.toggle('active', isGroup);
            const typeEl = $('shownType');
            typeEl.textContent = !all.length ? '' : (isGroup ? GROUPS[currentFilter].label : 'الكل');
            typeEl.title = typeEl.textContent;
            renderGroupMenu();

            const vis = getVisibleIndices();
            $('listCount').innerText = vis.length;
            listContainer.innerHTML = '';

            if (all.length === 0) {
                listContainer.innerHTML = '<div class="empty">لم يتم استخراج قنوات بعد</div>';
                return;
            }
            if (vis.length === 0) {
                listContainer.innerHTML = '<div class="empty">لا توجد نتائج مطابقة</div>';
                return;
            }

            vis.forEach(index => {
                const ch = all[index];
                const card = document.createElement('div');
                card.id = `channelCard_${index}`;
                card.className = "channel-card";
                const hasDRM = ch.k1 && ch.k2;
                const type = getType(ch.url);
                const pr = ch.probe;
                card.title = `${hasDRM ? 'DRM' : 'Free'} • ${type === 'other' ? 'LINK' : type.toUpperCase()}` + (pr ? `\n${pr.msg}` : '');

                card.innerHTML = `
                    <div class="ch-name"></div>
                    <div class="ch-btns">
                        <button title="نسخ الرابط" data-act="link"><i class="fa-solid fa-link"></i></button>
                        <button title="نسخ سطر الكود" data-act="code"><i class="fa-solid fa-code"></i></button>
                    </div>
                `;
                const nameEl = card.querySelector('.ch-name');
                if (pr) {
                    const b = document.createElement('span');
                    b.className = 'pbadge pb-' + pr.s; b.textContent = ICONS[pr.s] || '❓'; b.title = pr.msg;
                    nameEl.appendChild(b);
                }
                nameEl.appendChild(document.createTextNode(`${index + 1}. ${ch.name}`));
                card.addEventListener('click', () => playParsedChannel(index));
                card.querySelector('[data-act="link"]').addEventListener('click', (e) => copyToClipboard(ch.url, e));
                card.querySelector('[data-act="code"]').addEventListener('click', (e) => copyCodeLine(index, e));
                listContainer.appendChild(card);
            });
            updateActiveChannelStyle(false, noScroll);
        }

        /* ===== المحلل الذكي: يستخرج الاسم والرابط والشفرات مهما كان الشكل أو الترتيب ===== */
const HEX32_RE = /^[0-9a-f]{32}$/i;
const KID_ALIAS = new Set(['keyid', 'key_id', 'key-id', 'kid', 'k1', 'default_kid', 'defaultkid', 'keyids']);
const KEY_ALIAS = new Set(['key', 'k', 'k2', 'keyvalue', 'key_value', 'contentkey', 'content_key']);
const NAME_ALIAS = ['name', 'channel_name', 'channelname', 'channel', 'title', 'display_name', 'displayname',
    'label', 'tvg-name', 'tvg_name', 'text', 'caption', 'id', 'slug'];
const GENERIC_DICT_KEYS = new Set(['channels', 'sources', 'source', 'drm', 'clearkey', 'clearkeys', 'items', 'data',
    'playlist', 'config', 'setup', 'headers', 'keys', 'tracks', 'file', 'files', 'result', 'results', 'list', 'streams',
    'stream', 'options', 'params', 'settings', 'player', 'jwplayer', 'sets', 'videos', 'video', 'entries']);
const EXCL_CTX = /logo|icon|image|img|poster|thumb|cover|epg|licen[sc]e|laurl|la_url|certificate|cert|referer|referrer|origin|website|banner|background|avatar|picture|preview|homepage/i;
const URL_CTX = /^(url|file|src|source|link|stream|uri|manifest|hls|dash|mpd|m3u8|m3u|playbackurl|videourl|streamurl|stream_url|video_url|m3u8url|mpdurl|live|channel_url|path)$/i;
const MANIFEST_EXT = /\.(mpd|m3u8|m3u|ts|mp4|mkv|flv|mpegts|isml?)(?=[\/?#&|,"'\s]|$)/i;
const HEX_TOKEN = '[0-9a-fA-F][0-9a-fA-F-]{30,34}[0-9a-fA-F]';
const PAIR_RE_SRC = '(?<![0-9a-fA-F-])(' + HEX_TOKEN + ')["\'`]?\\s*[:=]\\s*["\'`]?(' + HEX_TOKEN + ')(?![0-9a-fA-F-])';

function normalizeText(t) {
    let s = String(t).replace(/\r\n?/g, '\n')
        .replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g, '')
        .replace(/\\u002[fF]/g, '/').replace(/\\u0026/g, '&').replace(/\\\//g, '/')
        .replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#0*39;/g, "'")
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>');
    if (/\\"(url|file|name|title|keyId|key)\\"/i.test(s)) s = s.replace(/\\"/g, '"');
    return s;
}

function normKey(v, allowB64) {
    if (v == null) return '';
    v = String(v).trim().replace(/^["'`]+|["'`]+$/g, '');
    if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v)) v = v.replace(/-/g, '');
    if (HEX32_RE.test(v)) return v.toLowerCase();
    if (allowB64 && /^[A-Za-z0-9_-]{22}(==)?$/.test(v)) {
        try {
            const b = atob(v.replace(/=+$/, '').replace(/-/g, '+').replace(/_/g, '/') + '==');
            if (b.length === 16) return Array.from(b).map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
        } catch (e) { /* ignore */ }
    }
    return '';
}

function cleanName(n) {
    return String(n || '').replace(/<[^>]*>/g, ' ').replace(/\\(["'`\\\/])/g, '$1')
        .replace(/\s+/g, ' ').replace(/^[\s"'`,;|:\-]+|[\s"'`,;|:]+$/g, '').trim();
}

function validName(n) {
    if (!n || n.length > 120) return false;
    if (/^https?:/i.test(n) || HEX32_RE.test(n)) return false;
    return /[\p{L}\p{N}]/u.test(n);
}

/* كل الحقول (مفتاح: قيمة) بأي ترتيب — بعلامات تنصيص أو بدونها */
function extractFields(text) {
    const out = [];
    const re = /(?:^|[\s,{\[(;])["'`]?([A-Za-z_$][\w$\-]*)["'`]?\s*[:=]\s*(?:(["'`])((?:\\.|(?!\2)[^\\])*)\2|([^\s,{}\[\]()]+))/g;
    let m;
    while ((m = re.exec(text)) !== null) {
        const quoted = m[2] !== undefined;
        out.push({ k: m[1], v: quoted ? m[3] : m[4], q: quoted });
    }
    return out;
}

function pickName(fields) {
    for (const alias of NAME_ALIAS) {
        for (const f of fields) {
            if (!f.q || f.k.toLowerCase() !== alias) continue;
            const n = cleanName(f.v);
            if (alias === 'id' && /^\d+$/.test(n)) continue;
            if (validName(n)) return n;
        }
    }
    return '';
}

function pairsFromFields(fields) {
    const out = [];
    let kid = '', key = '';
    for (const f of fields) {
        const lk = f.k.toLowerCase();
        if (KID_ALIAS.has(lk)) {
            const n = normKey(f.v, lk === 'kid' || lk === 'default_kid');
            if (n) kid = n;
        } else if (KEY_ALIAS.has(lk)) {
            const n = normKey(f.v, lk === 'k');
            if (n) key = n;
        }
        if (kid && key) { out.push([kid, key]); kid = ''; key = ''; }
    }
    return out;
}

/* الشفرات: kid:key  |  "kid":"key"  |  keyId/key بأي ترتيب  |  k/kid (base64)  |  توالي أرقام hex */
function extractKeyPairs(text) {
    const pairs = [], seen = new Set();
    const add = (a, b) => { if (a && b && !seen.has(a)) { seen.add(a); pairs.push([a, b]); } };
    const t = String(text).replace(/https?:\/\/[^\s"'`<>]+/gi, ' ');

    const re = new RegExp(PAIR_RE_SRC, 'g');
    let m;
    while ((m = re.exec(t)) !== null) add(normKey(m[1]), normKey(m[2]));

    pairsFromFields(extractFields(t)).forEach(p => add(p[0], p[1]));

    if (pairs.length === 0) {
        const tokens = t.match(/(?<![0-9a-fA-F-])[0-9a-fA-F]{32}(?![0-9a-fA-F-])/g) || [];
        for (let i = 0; i + 1 < tokens.length; i += 2) add(tokens[i].toLowerCase(), tokens[i + 1].toLowerCase());
    }
    return pairs;
}

function nameFromUrl(url) {
    try {
        const u = new URL(url);
        const segs = u.pathname.split('/').filter(Boolean);
        const skip = /^(dash|hls|out|v\d+|live|eds|index|manifest|master|playlist|chunklist|stream|main|mpd|m3u8|\d+|[0-9a-f]{20,})$/i;
        let file = segs.length ? segs[segs.length - 1].replace(/\.[a-z0-9]+$/i, '') : '';
        if (file && !skip.test(file)) return file;
        for (let i = segs.length - 2; i >= 0; i--) {
            const s = segs[i].replace(/\.[a-z0-9]+$/i, '');
            if (!skip.test(s)) return s;
        }
        return u.hostname;
    } catch (e) { return ''; }
}

function makeStore() {
    const list = [], idx = new Map();
    const k = u => u.replace(/[\s,;]+$/, '');
    return {
        list,
        has: u => idx.has(k(u)),
        add(ch) {
            const u = k(ch.url || '');
            if (!u) return;
            let ex = idx.get(u);
            if (!ex) { ex = { name: '', nameFound: false, url: u, pairs: [] }; idx.set(u, ex); list.push(ex); }
            if (ch.name && !ex.nameFound) { ex.name = ch.name; ex.nameFound = true; }
            (ch.pairs || []).forEach(p => { if (!ex.pairs.some(q => q[0] === p[0])) ex.pairs.push(p); });
        }
    };
}

/* ---------- 1) M3U / Kodi / EXTVLCOPT ---------- */
function parseM3U(src, store) {
    const fresh = () => ({ name: '', pairs: [] });
    let meta = fresh();
    for (const raw of src.split('\n')) {
        const line = raw.trim();
        if (!line) continue;
        if (/^#EXTINF/i.test(line)) {
            meta = fresh();
            const stripped = line.replace(/[\w\-.]+\s*=\s*"[^"]*"/g, '').replace(/[\w\-.]+\s*=\s*'[^']*'/g, '');
            const ci = stripped.indexOf(',');
            let name = ci >= 0 ? cleanName(stripped.slice(ci + 1)) : '';
            if (!validName(name)) {
                const tm = line.match(/tvg-name\s*=\s*"([^"]+)"/i);
                name = tm ? cleanName(tm[1]) : '';
            }
            meta.name = validName(name) ? name : '';
            continue;
        }
        if (line[0] === '#') { meta.pairs.push(...extractKeyPairs(line)); continue; }
        const um = line.match(/^https?:\/\/\S+/i);
        if (um) {
            const parts = um[0].split('|');
            const pairs = meta.pairs.concat(extractKeyPairs(line.slice(um[0].length) + ' ' + parts.slice(1).join('|')));
            store.add({ name: meta.name, url: parts[0].replace(/[.,;:!]+$/, ''), pairs });
            meta = fresh();
        }
    }
}

/* ---------- روابط البث ---------- */
function findStreamUrls(src) {
    const hits = [];
    const re = /https?:\/\/[^\s"'`<>\\)\]}]+/gi;
    let m;
    while ((m = re.exec(src)) !== null) {
        const raw = m[0], start = m.index;
        let url = raw, suffix = '', hadPipe = false;
        const pi = url.indexOf('|');
        if (pi > -1) { suffix = url.slice(pi + 1); url = url.slice(0, pi); hadPipe = true; }
        const ci = url.search(/,(?=[0-9a-fA-F]{32})/);
        if (ci > -1) url = url.slice(0, ci);
        url = url.replace(/[.,;:!]+$/, '');
        if (url.length < 10) continue;

        const pre = src.slice(Math.max(0, start - 80), start);
        const cm = pre.match(/([A-Za-z_][\w\-.]*)["'`]?\s*[:=]\s*["'`]?\s*$/);
        const ctx = cm ? cm[1].split('.').pop() : '';
        const low = url.toLowerCase();

        if (/\.(png|jpe?g|gif|webp|svg|ico|bmp|css|js|json|html?|xml|txt|woff2?)(\?|#|$)/.test(low)) continue;
        if (ctx && EXCL_CTX.test(ctx) && !URL_CTX.test(ctx)) continue;
        const isManifest = MANIFEST_EXT.test(low);
        if (/licen[sc]e|acquire-license|widevine|playready|drmtoday|\/lic[\/?]/.test(low) && !isManifest) continue;

        let ok = isManifest || (ctx && URL_CTX.test(ctx));
        if (!ok) {
            const ls = src.lastIndexOf('\n', start - 1) + 1;
            ok = /^[\s\-*\d.)]*$/.test(src.slice(ls, start));   // سطر يبدأ برابط فقط
        }
        if (!ok) continue;
        hits.push({ url, start, end: start + (hadPipe ? raw.length : url.length), suffix });
    }
    return hits;
}

/* ---------- 2) كائنات {...} بأي ترتيب للحقول ---------- */
function getBraceSpans(s) {
    const spans = [], stack = [];
    let q = null;
    for (let i = 0; i < s.length; i++) {
        const c = s[i];
        if (q) {
            if (c === '\\') { i++; continue; }
            if (c === q) q = null;
            else if (c === '\n' && q !== '`') q = null;
            continue;
        }
        if (c === '"' || c === "'" || c === '`') { q = c; continue; }
        if (c === '{') stack.push(i);
        else if (c === '}' && stack.length) spans.push({ s: stack.pop(), e: i });
    }
    return spans;
}

function parseObjects(src, hits, store) {
    if (!hits.length || src.indexOf('{') === -1) return;
    const spans = getBraceSpans(src);
    if (!spans.length) return;

    const lowerBound = pos => {
        let lo = 0, hi = hits.length;
        while (lo < hi) { const mid = (lo + hi) >> 1; if (hits[mid].start < pos) lo = mid + 1; else hi = mid; }
        return lo;
    };
    const distinctUrls = sp => {
        const set = new Set();
        for (let i = lowerBound(sp.s); i < hits.length && hits[i].start <= sp.e; i++) set.add(hits[i].url);
        return set.size;
    };

    for (const h of hits) {
        if (store.has(h.url)) continue;
        const chain = spans.filter(sp => sp.s < h.start && sp.e >= h.end).sort((a, b) => (a.e - a.s) - (b.e - b.s));
        if (!chain.length) continue;
        let best = chain[0];
        for (let i = 1; i < chain.length; i++) {
            if (chain[i].e - chain[i].s > 3000) break;
            if (distinctUrls(chain[i]) > 1) break;
            best = chain[i];
        }
        const text = src.slice(best.s, best.e + 1);
        const fields = extractFields(text);
        let name = pickName(fields);
        if (!name) {
            const pm = src.slice(Math.max(0, best.s - 120), best.s)
                .match(/["'`]?([^"'`{}\[\]\n:,][^"'`{}\[\]\n:]*?)["'`]?\s*:\s*$/);
            if (pm) {
                const cand = cleanName(pm[1]);
                if (validName(cand) && !GENERIC_DICT_KEYS.has(cand.toLowerCase())) name = cand;
            }
        }
        store.add({ name, url: h.url, pairs: extractKeyPairs(text + ' ' + h.suffix) });
    }
}

/* ---------- 3) أسطر حرة: اسم | رابط | شفرات بأي ترتيب ---------- */
function stripDecor(t) {
    return String(t).replace(/^\s*(#|\/\/|\*|-|•)+\s*/, '').replace(/^\s*\d+\s*[.)]\s+/, '')
        .replace(/[|,;=:"'`{}\[\]()<>]+/g, ' ').replace(/\s+/g, ' ').trim();
}

function nameLike(line) {
    const raw = String(line);
    if (/https?:/i.test(raw) || /^\s*#EXT/i.test(raw)) return '';
    if (/\b(k1|k2|keyid|key_id|kid|key|url|file|drm|license|clearkey)\b\s*[:=]/i.test(raw)) return '';
    if (/licen[sc]e|clearkey|key_?id|\bk[12]\b|^\s*keys?\s*$/i.test(raw)) return '';
    if (/(?<![0-9a-fA-F])[0-9a-fA-F]{32}(?![0-9a-fA-F])/.test(raw)) return '';
    const t = stripDecor(raw);
    if (!t || t.length > 100 || !/\p{L}/u.test(t)) return '';
    return t;
}

function parseLoose(src, hits, store) {
    if (!hits.length) return;
    const lines = src.split('\n');
    const starts = [];
    let off = 0;
    for (const l of lines) { starts.push(off); off += l.length + 1; }
    const lineOf = pos => {
        let lo = 0, hi = starts.length - 1;
        while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (starts[mid] <= pos) lo = mid; else hi = mid - 1; }
        return lo;
    };
    const infos = hits.map(h => ({ h, li: lineOf(h.start) }));
    const n = infos.length;

    const gapLines = g => {
        const from = (g < 0 ? -1 : infos[g].li) + 1;
        const to = (g + 1 < n ? infos[g + 1].li : lines.length);
        return lines.slice(from, to);
    };
    const gaps = [];
    for (let g = -1; g < n; g++) {
        const ls = gapLines(g);
        gaps[g + 1] = { lines: ls, pairs: extractKeyPairs(ls.join('\n')), names: ls.map(nameLike).filter(Boolean) };
    }
    const keysFirst = gaps[0].pairs.length > 0;
    const sameLineName = (info) => {
        const line = lines[info.li];
        const rest = line.slice(0, info.h.start - starts[info.li]) + ' ' + line.slice(info.h.end - starts[info.li]);
        return rest;
    };
    const firstRest = sameLineName(infos[0]);
    const nameBefore = !!(gaps[0].names.length || nameFromRest(firstRest)) || !gaps[1].names.length;

    infos.forEach((info, i) => {
        if (store.has(info.h.url)) return;
        const rest = sameLineName(info);
        const pairs = extractKeyPairs(rest + ' ' + info.h.suffix);
        let name = nameFromRest(rest);

        const keyGap = keysFirst ? gaps[i] : gaps[i + 1];
        keyGap.pairs.forEach(p => pairs.push(p));

        if (!name) {
            if (nameBefore) { const ns = gaps[i].names; name = ns.length ? ns[ns.length - 1] : ''; }
            else { const ns = gaps[i + 1].names; name = ns.length ? ns[0] : ''; }
        }
        store.add({ name, url: info.h.url, pairs });
    });
}

function nameFromRest(rest) {
    const n = pickName(extractFields(rest));
    if (n) return n;
    const t = nameLike(String(rest).replace(new RegExp(PAIR_RE_SRC, 'g'), ' '));
    return validName(t) ? t : '';
}

/* ---------- الدالة الرئيسية ---------- */
function parseInputText(text) {
    const src = normalizeText(text);
    const store = makeStore();

    if (/#EXTINF/i.test(src)) parseM3U(src, store);
    const hits = findStreamUrls(src);
    parseObjects(src, hits, store);
    parseLoose(src, hits, store);

    const out = store.list.map(ex => ({
        name: ex.name || nameFromUrl(ex.url),
        url: ex.url,
        k1: ex.pairs.length ? ex.pairs[0][0] : '',
        k2: ex.pairs.length ? ex.pairs[0][1] : '',
        _pos: src.indexOf(ex.url)
    }));
    out.sort((a, b) => a._pos - b._pos);
    out.forEach(c => { delete c._pos; });
    return out;
}

        function parseAndLoadChannels() {
            const rawText = document.getElementById('bulkInput').value;
            if (!rawText.trim()) return;

            probeToken++;                                   // يلغي أي فحص جارٍ للقائمة السابقة
            $('probeProg').textContent = '';
            window.extractedChannelsList = parseInputText(rawText);

            activeChannelIndex = -1;
            toggleSearch(false);
            updateCounts();
            setFilter('all');

            if (window.extractedChannelsList.length === 0) {
                showToast('لم يتم العثور على قنوات صالحة!');
                return;
            }
            showToast(`تم استخراج ${window.extractedChannelsList.length} قناة`);
            probeAll();                                     // الفحص التلقائي
        }

        function clearAll() {
            stopPlayer();
            probeToken++;                                   // يلغي الفحص الجاري
            $('probeProg').textContent = '';
            document.getElementById('singleUrl').value = '';
            document.getElementById('singleK1').value = '';
            document.getElementById('singleK2').value = '';
            document.getElementById('bulkInput').value = '';
            document.getElementById('searchInput').value = '';
            toggleSearch(false);

            window.extractedChannelsList = [];
            activeChannelIndex = -1;
            updateCounts();
            setFilter('all');
        }
    </script>
