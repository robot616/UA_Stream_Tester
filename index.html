<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة فحص وتشغيل بلايليست القنوات الذكية</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer" />

    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3159/3159073.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="//ssl.p.jwpcdn.com/player/v/8.26.0/jwplayer.js"></script>
    <script>jwplayer.key = "XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo";</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #141414;
            --header: #0d0d0d;
            --panel: #222222;
            --panel-2: #1a1a1a;
            --field: #111111;
            --border: #333333;
            --border-2: #3d3d3d;
            --text: #f5f5f5;
            --muted: #8a8a8a;
            --green: #22c55e;
            --green-dim: #4ade80;
            --blue: #0a84ff;
            --red: #ff5252;
            --btn: #374151;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: var(--bg); color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* ===== Header ===== */
        header {
            position: relative; flex-shrink: 0;
            background: var(--header); border-bottom: 2px solid var(--green);
            height: 62px; display: flex; align-items: center; justify-content: center; gap: 12px;
            font-size: 22px; font-weight: 700; color: var(--green);
        }
        header .bolt { color: #fb923c; font-size: 20px; }
        .gear {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--border-2);
            background: var(--panel); color: #aaa; cursor: pointer; font-size: 14px; transition: .2s;
        }
        .gear:hover { color: #fff; background: #2d2d2d; }
        .ua-pop {
            display: none; position: absolute; left: 16px; top: 54px; z-index: 50; width: 440px; max-width: calc(100vw - 32px);
            background: var(--panel); border: 1px solid var(--border-2); border-radius: 8px; padding: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,.5); font-size: 11px; color: var(--muted); font-weight: 400;
        }
        .ua-pop.open { display: block; }
        .ua-pop label { display: block; margin-bottom: 6px; }
        #uaInput { height: 34px; font-size: 11px; color: var(--green-dim); }

        /* ===== Layout ===== */
        .wrap {
            flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px;
            width: 100%; max-width: 1000px; margin: 16px auto; padding: 0 0;
        }
        @media (max-width: 1040px) { .wrap { width: calc(100% - 24px); } }

        .card {
            flex-shrink: 0; background: var(--panel); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; box-shadow: 0 4px 14px rgba(0,0,0,.3);
        }

        #bulkInput {
            width: 100%; height: 96px; resize: none; display: block;
            background: #17291f; border: 1px dashed var(--green);
            border-radius: 6px; padding: 8px 10px; color: #d4d4d4;
            font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; outline: none;
        }
        #bulkInput::placeholder { color: #86d9a5; opacity: .75; }

        .btn-extract {
            width: 100%; height: 44px; margin-top: 10px; border: 0; border-radius: 6px;
            background: var(--blue); color: #fff; font-weight: 700; font-size: 13px;
            cursor: pointer; transition: filter .2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-extract:hover { filter: brightness(1.12); }

        .fields { display: flex; gap: 12px; margin-top: 16px; }
        .fields > * { flex: 1; min-width: 0; }

        input[type=text], select {
            height: 42px; width: 100%; background: var(--field);
            border: 1px solid var(--border-2); border-radius: 6px; color: #fff;
            padding: 0 14px; font-size: 13px; outline: none; transition: border-color .2s;
            font-family: ui-monospace, Consolas, monospace;
        }
        select { font-family: inherit; cursor: pointer; }
        input[type=text]::placeholder { color: #6b6b6b; font-family: inherit; font-size: 12px; }
        input[type=text]:focus, select:focus { border-color: var(--green); }

        /* ===== Actions row ===== */
        .actions { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; gap: 10px; }
        .group { display: flex; align-items: center; gap: 10px; }

        .btn {
            height: 39px; border-radius: 6px; border: 1px solid var(--border-2);
            background: #2b2b2b; color: #ddd; cursor: pointer; font-size: 12px; font-weight: 700;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: .2s;
            white-space: nowrap;
        }
        .btn:hover { background: #363636; }
        .btn:active { transform: scale(.97); }
        .btn-play { background: var(--green); border-color: var(--green); color: #04130a; padding: 0 28px; }
        .btn-play:hover { background: var(--green-dim); }
        .btn-clear { background: var(--red); border-color: var(--red); color: #fff; padding: 0 22px; }
        .btn-clear:hover { background: #ff6b6b; }
        .btn-sq { width: 42px; font-size: 10px; }

        .chip {
            height: 36px; padding: 0 10px; border-radius: 6px; background: transparent;
            border: 1px solid; cursor: pointer; font-size: 12px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 8px; transition: .2s; opacity: .75;
        }
        .chip b {
            min-width: 22px; height: 22px; padding: 0 5px; border-radius: 4px;
            display: inline-flex; align-items: center; justify-content: center; font-size: 12px;
        }
        .chip.all { color: var(--green); border-color: var(--green); }
        .chip.all b { background: var(--green); color: #04130a; }
        .chip.mpd { color: #b4443f; border-color: #6b2a28; }
        .chip.mpd b { background: #7a2e2b; color: #e08a86; }
        .chip.m3u8 { color: #2f6a99; border-color: #234a6b; }
        .chip.m3u8 b { background: #274e70; color: #6aa7d6; }
        .chip.ts { color: #a68a1e; border-color: #6b5a14; }
        .chip.ts b { background: #7a6516; color: #d8bd4a; }
        .chip:hover, .chip.active { opacity: 1; }
        .chip.active { box-shadow: 0 0 0 1px currentColor inset; }
        .btn-copy { width: 42px; height: 36px; font-size: 13px; background: #374151; }

        /* ===== Bottom ===== */
        .bottom { flex: 1; display: flex; gap: 20px; min-height: 0; overflow: hidden; }

        .player-box {
            flex: 1; min-width: 0; position: relative; background: #000; border-radius: 10px;
            border: 1px solid var(--border); overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.4);
        }
        #playerContainer { width: 100%; height: 100%; }
        .overlay {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 20;
            display: flex; align-items: center; justify-content: space-between; pointer-events: none;
        }
        .overlay > * { pointer-events: auto; }
        .overlay-start { display: flex; align-items: center; gap: 8px; min-width: 0; }
        #activeChannelTitle {
            font-size: 12px; font-weight: 700; color: var(--green);
            max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            text-shadow: 0 1px 3px #000; transition: opacity .25s;
        }
        .badge {
            display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
            border-radius: 999px; font-size: 11px; font-weight: 700; border: 1px solid #3a3a3a;
            background: rgba(30,30,30,.9); color: #9ca3af; transition: .25s;
        }
        .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
        .badge.playing { background: rgba(34,197,94,.15); color: var(--green-dim); border-color: rgba(34,197,94,.4); }
        .badge.playing .dot { background: var(--green); animation: pulse 1.6s infinite; }
        .badge.loading { background: rgba(245,158,11,.15); color: #fbbf24; border-color: rgba(245,158,11,.4); }
        .badge.loading .dot { background: #f59e0b; animation: pulse .8s infinite; }
        .badge.error { background: rgba(255,82,82,.15); color: #ff8a8a; border-color: rgba(255,82,82,.4); }
        .badge.error .dot { background: var(--red); }
        @keyframes pulse { 50% { opacity: .3; } }
        .btn-stop { height: 30px; padding: 0 12px; background: rgba(30,30,30,.92); }
        .btn-stop i { color: var(--red); }

        .sidebar {
            width: 295px; flex-shrink: 0; background: var(--panel-2);
            border: 1px solid var(--border); border-radius: 10px; padding: 10px;
            display: flex; flex-direction: column; overflow: hidden; min-height: 0;
        }
        .search-row { display: flex; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .count-box {
            width: 51px; height: 37px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            background: var(--field); border: 1px solid var(--border-2); border-radius: 6px;
            color: var(--green); font-weight: 700; font-size: 14px;
        }
        #searchInput { height: 37px; font-size: 12px; padding: 0 12px; font-family: inherit; }
        #parsedList {
            flex: 1; min-height: 0; position: relative; overflow-y: auto; padding-top: 8px;
            display: flex; flex-direction: column; gap: 6px; scrollbar-width: thin;
        }
        .empty { margin: 28px auto 0; color: #6b6b6b; font-size: 12px; }

        .channel-card {
            flex-shrink: 0; height: 41px; padding: 0 8px 0 10px;
            background: var(--panel); border-radius: 6px; border-right: 3px solid transparent;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            cursor: pointer; color: #d9d9d9;
            transition: background-color .3s ease, color .3s ease, border-color .3s ease;
        }
        .channel-card:hover { background: #2a2a2a; }
        .channel-card.active { background: #173323; color: var(--green-dim); border-right-color: var(--green); font-weight: 700; }
        .ch-name { flex: 1; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ch-btns { display: flex; gap: 6px; flex-shrink: 0; }
        .ch-btns button {
            width: 30px; height: 26px; background: var(--btn); border: 0; color: #d1d5db;
            border-radius: 4px; cursor: pointer; font-size: 11px; transition: background .2s;
        }
        .ch-btns button:hover { background: #4b5563; color: #fff; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* ===== JW Player tweaks (من الكود الأصلي) ===== */
        .jw-icon-playlist, .jw-icon-next, .jw-related-btn { display: none !important; }
        .jw-icon-fullscreen svg { display: none !important; }
        .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOCAzSDVhMiAyIDAgMCAwLTIgMnYzbTE4IDBWNWEyIDIgMCAwIDAtMi0yaC0zbTAgMThoM2EyIDIgMCAwIDAgMi0ydi0zTTMgMTZ2M2EyIDIgMCAwIDAgMiAyaDMiPjwvcGF0aD48L3N2Zz4=');
            background-size: 16px; background-position: center; background-repeat: no-repeat;
        }
        .jw-flag-fullscreen .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOCAzdjNhMiAyIDAgMCAxLTIgMkgzbTE4IDBoLTNhMiAyIDAgMCAxLTItMlYzbTAgMTh2LTNhMiAyIDAgMCAxIDItMmgzTTMgMTZoM2EyIDIgMCAwIDEgMiAydjMiPjwvcGF0aD48L3N2Zz4=');
        }

        @media (max-width: 760px) {
            .fields { flex-wrap: wrap; }
            .fields > * { flex: 1 1 45%; }
            .actions { flex-direction: column; align-items: stretch; }
            .group { flex-wrap: wrap; justify-content: center; }
            html, body { height: auto; }
            body { overflow: auto; }
            .wrap { min-height: auto; }
            .bottom { flex-direction: column; overflow: visible; flex: none; }
            .player-box { height: 300px; flex: none; }
            .sidebar { width: 100%; height: 320px; }
        }
    </style>
</head>
<body>

    <header>
        <button class="gear" onclick="document.getElementById('uaPop').classList.toggle('open')" title="إعدادات User-Agent"><i class="fa-solid fa-gear"></i></button>
        <div class="ua-pop" id="uaPop">
            <label for="uaInput">User-Agent</label>
            <input type="text" id="uaInput" value="Mozilla/5.0 (Smart-TV; Linux; Tizen 6.0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/85.0.4183.102 TV Safari/537.36" title="User-Agent">
        </div>
        <span>أداة فحص وتشغيل بلايليست القنوات الذكية</span>
        <i class="fa-solid fa-bolt bolt"></i>
    </header>

    <div class="wrap">

        <div class="card">
            <!-- 1. استخراج الأكواد والقوائم -->
            <textarea id="bulkInput" placeholder="الصق محتوى الملف بالكامل هنا..."></textarea>
            <button class="btn-extract" onclick="parseAndLoadChannels()">
                استخراج وفصل القنوات تلقائياً <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>

            <!-- 2. الإدخال السريع -->
            <div class="fields">
                <input type="text" id="singleUrl" placeholder="رابط القناة (URL)">
                <input type="text" id="singleK1" placeholder="Key ID (k1)">
                <input type="text" id="singleK2" placeholder="Key (k2)">
                <select id="playerType" title="المشغل">
                    <option value="jw">JW Player (المفضل)</option>
                    <option value="shaka">Shaka Player</option>
                </select>
            </div>

            <!-- 3. الأزرار والفلاتر -->
            <div class="actions">
                <div class="group">
                    <button class="btn btn-play" onclick="playSingleLink()">تشغيل القناة المحددة <i class="fa-solid fa-play"></i></button>
                    <button class="btn btn-clear" onclick="clearAll()">مسح الكل <i class="fa-solid fa-trash-can"></i></button>
                    <button class="btn btn-sq" onclick="navigateChannel(-1)" title="القناة السابقة"><i class="fa-solid fa-caret-up"></i></button>
                    <button class="btn btn-sq" onclick="navigateChannel(1)" title="القناة التالية"><i class="fa-solid fa-caret-down"></i></button>
                </div>
                <div class="group" style="gap:8px">
                    <button class="chip all active" data-filter="all" onclick="setFilter('all')">الكل <b id="cntAll">0</b></button>
                    <button class="chip mpd" data-filter="mpd" onclick="setFilter('mpd')">MPD <b id="cntMpd">0</b></button>
                    <button class="chip m3u8" data-filter="m3u8" onclick="setFilter('m3u8')">M3U8 <b id="cntM3u8">0</b></button>
                    <button class="chip ts" data-filter="ts" onclick="setFilter('ts')">TS <b id="cntTs">0</b></button>
                    <button class="btn btn-copy" onclick="copyAllLines()" title="نسخ جميع أسطر الكود"><i class="fa-regular fa-copy"></i></button>
                </div>
            </div>
        </div>

        <div class="bottom">
            <!-- المشغل -->
            <div class="player-box">
                <div class="overlay">
                    <div class="overlay-start">
                        <span id="statusBadge" class="badge"><span class="dot"></span> غير متصل</span>
                        <span id="activeChannelTitle"></span>
                    </div>
                    <button class="btn btn-stop" onclick="stopPlayer()"><i class="fa-solid fa-stop"></i> إيقاف</button>
                </div>
                <div id="playerContainer">
                    <div id="jwplayerDiv" style="width:100%;height:100%;"></div>
                </div>
            </div>

            <!-- القنوات المستخرجة -->
            <aside class="sidebar">
                <div class="search-row">
                    <div class="count-box" id="parsedCount">0</div>
                    <input type="text" id="searchInput" placeholder="بحث عن قناة..." oninput="renderList()">
                </div>
                <div id="parsedList"><div class="empty">لم يتم استخراج قنوات بعد</div></div>
            </aside>
        </div>
    </div>

    <script>
        let currentPlayer = null;
        let shakaPlayer = null;
        let playTimer = null;
        window.extractedChannelsList = [];
        let customUA = document.getElementById('uaInput').value;
        let activeChannelIndex = -1;
        let currentFilter = 'all';

        document.getElementById('uaInput').addEventListener('input', (e) => {
            customUA = e.target.value.trim();
        });

        (function() {
            var originalFetch = window.fetch;
            var originalXHR = window.XMLHttpRequest;
            window.fetch = function(url, options) {
                options = options || {}; options.headers = options.headers || {};
                options.headers['User-Agent'] = customUA;
                return originalFetch.call(this, url, options);
            };
            var XHROpen = originalXHR.prototype.open;
            originalXHR.prototype.open = function(method, url) {
                XHROpen.apply(this, arguments);
                try { this.setRequestHeader('User-Agent', customUA); } catch (e) {}
            };
        })();

        function setStatus(text, state) {
            const el = document.getElementById('statusBadge');
            el.className = 'badge ' + (state || '');
            el.innerHTML = `<span class="dot"></span> ${text}`;
        }

        function setTitle(text) {
            const el = document.getElementById('activeChannelTitle');
            el.style.opacity = 0;
            setTimeout(() => { el.innerText = text; el.style.opacity = 1; }, 120);
        }

        function copyToClipboard(text, e = null) {
            if (e) e.stopPropagation();
            navigator.clipboard.writeText(text);
        }

        function copyCodeLine(index, e) {
            e.stopPropagation();
            const ch = window.extractedChannelsList[index];
            const codeStr = `{ id: "${ch.name}", name: "${ch.name}", url: "${ch.url}", k1: "${ch.k1}", k2: "${ch.k2}" }`;
            copyToClipboard(codeStr);
        }

        function copyAllLines() {
            if (!window.extractedChannelsList || window.extractedChannelsList.length === 0) return;
            let textToCopy = window.extractedChannelsList.map((ch) =>
                `{ id: "${ch.name}", name: "${ch.name}", url: "${ch.url}", k1: "${ch.k1}", k2: "${ch.k2}" }`
            ).join(',\n');
            copyToClipboard(textToCopy);
            alert("تم نسخ أسطر الكود بنجاح!");
        }

        /* ===== التشغيل: نفس المشغل يُعاد استخدامه عند التبديل (بدون وميض) ===== */
        function setupJW(item) {
            currentPlayer = jwplayer("jwplayerDiv").setup({
                playlist: [item],
                width: "100%", height: "100%", autostart: true, stretching: "uniform"
            });

            currentPlayer.on('ready', function() {
                let isStretched = false;
                const diagonalCutArrow = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMTQgMTBsNy03bS02IDBoNnY2bS0xMSA1bC03IDdtNiAwSDN2LTYiLz48L3N2Zz4=";

                currentPlayer.addButton(
                    diagonalCutArrow, "توسيع/تضييق الصورة",
                    function() {
                        let videoEl = document.querySelector('.jw-video');
                        if (!isStretched) {
                            currentPlayer.setConfig({ stretching: "exactfit" });
                            if (videoEl) { videoEl.style.objectFit = 'fill'; videoEl.style.width = '100%'; videoEl.style.height = '100%'; }
                            isStretched = true;
                        } else {
                            currentPlayer.setConfig({ stretching: "uniform" });
                            if (videoEl) { videoEl.style.objectFit = 'contain'; }
                            isStretched = false;
                        }
                    }, "stretch-button"
                );
            });

            currentPlayer.on('play', () => setStatus('يعمل الآن', 'playing'));
            currentPlayer.on('buffer', () => setStatus('جاري التحميل...', 'loading'));

            currentPlayer.on('audioTracks', function() {
                const tracks = currentPlayer.getAudioTracks() || [];
                tracks.forEach((track, index) => {
                    const label = (track.label || '').toLowerCase();
                    if (label.includes("ara") || (track.label || '').includes("عربي")) {
                        currentPlayer.setCurrentAudioTrack(index);
                    }
                });
            });

            currentPlayer.on('error', function() { setStatus('فشل التشغيل', 'error'); });
            currentPlayer.on('setupError', function() { setStatus('فشل التشغيل', 'error'); });
        }

        function playStream(name, url, k1, k2) {
            if (!url) return;
            setTitle(name || 'رابط اختباري');
            setStatus('جاري التحميل...', 'loading');

            if (document.getElementById('playerType').value === 'shaka') {
                destroyJW();
                playWithShaka(url, k1, k2);
                return;
            }

            destroyShaka();
            const item = { file: url };
            if (k1 && k2) item.drm = { clearkey: { keyId: k1, key: k2 } };

            if (currentPlayer) {
                // تبديل سلس: نفس المشغل، بدون إزالة أو إعادة بناء
                currentPlayer.load([item]);
                currentPlayer.play(true);
            } else {
                setupJW(item);
            }
        }

        async function playWithShaka(url, k1, k2) {
            try {
                shaka.polyfill.installAll();
                let video = document.getElementById('shakaVideo');
                if (!video) {
                    document.getElementById('playerContainer').innerHTML =
                        '<video id="shakaVideo" controls autoplay style="width:100%;height:100%;background:#000"></video>';
                    video = document.getElementById('shakaVideo');
                }
                if (!shakaPlayer) {
                    shakaPlayer = new shaka.Player(video);
                    shakaPlayer.addEventListener('error', () => setStatus('فشل التشغيل', 'error'));
                }
                shakaPlayer.configure({ drm: { clearKeys: (k1 && k2) ? { [k1]: k2 } : {} } });
                await shakaPlayer.load(url);
                setStatus('يعمل الآن', 'playing');
            } catch (err) {
                setStatus('فشل التشغيل', 'error');
            }
        }

        function destroyJW() {
            if (currentPlayer) { currentPlayer.remove(); currentPlayer = null; }
        }

        function destroyShaka() {
            if (shakaPlayer) { shakaPlayer.destroy(); shakaPlayer = null; }
            if (document.getElementById('shakaVideo')) {
                document.getElementById('playerContainer').innerHTML = '<div id="jwplayerDiv" style="width:100%;height:100%;"></div>';
            }
        }

        function stopPlayer() {
            clearTimeout(playTimer);
            destroyJW();
            destroyShaka();
            setStatus('متوقف', 'idle');
            document.getElementById('activeChannelTitle').innerText = '';
        }

        function playSingleLink() {
            activeChannelIndex = -1;
            updateActiveChannelStyle();

            const url = document.getElementById('singleUrl').value.trim();
            const k1 = document.getElementById('singleK1').value.trim();
            const k2 = document.getElementById('singleK2').value.trim();
            playStream('اختبار سريّع', url, k1, k2);
        }

        function playParsedChannel(index, alignTop = false) {
            activeChannelIndex = index;
            updateActiveChannelStyle(alignTop);

            const ch = window.extractedChannelsList[index];
            if (ch) {
                // تعبئة البيانات المستخرجة تلقائياً في مربع الإدخال السريع لمعاينتها
                document.getElementById('singleUrl').value = ch.url || '';
                document.getElementById('singleK1').value = ch.k1 || '';
                document.getElementById('singleK2').value = ch.k2 || '';

                // تأخير بسيط: عند الضغط السريع على التالي/السابق تُحمّل آخر قناة فقط
                clearTimeout(playTimer);
                setStatus('جاري التحميل...', 'loading');
                playTimer = setTimeout(() => playStream(ch.name, ch.url, ch.k1, ch.k2), 180);
            }
        }

        /* تظليل القناة النشطة — القائمة نفسها لا تتحرك إلا إذا خرجت القناة من مجال الرؤية */
        function updateActiveChannelStyle(alignTop = false) {
            document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
            if (activeChannelIndex === -1) return;
            const card = document.getElementById(`channelCard_${activeChannelIndex}`);
            if (!card) return;
            card.classList.add('active');

            const list = document.getElementById('parsedList');
            const top = card.offsetTop - 8;
            const bottom = card.offsetTop + card.offsetHeight + 8;
            if (alignTop) {
                // التنقل بالأزرار: القناة المختارة تثبت عند أول مربع والقائمة هي التي تتحرك
                // (المتصفح يوقف التمرير تلقائياً عند آخر القائمة فيتحرك التظليل لأسفل)
                list.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
            } else if (top < list.scrollTop) {
                list.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
            } else if (bottom > list.scrollTop + list.clientHeight) {
                list.scrollTo({ top: bottom - list.clientHeight, behavior: 'smooth' });
            }
        }

        /* ===== الفلاتر والبحث والتنقل ===== */
        function getType(url) {
            const low = (url || '').toLowerCase();
            const clean = low.split('?')[0];
            if (/\.mpd(\/|$)/.test(clean)) return 'mpd';
            if (/\.m3u8(\/|$)/.test(clean)) return 'm3u8';
            if (/\.ts$/.test(clean)) return 'ts';
            if (low.includes('.mpd')) return 'mpd';
            if (low.includes('.m3u8')) return 'm3u8';
            if (low.includes('.ts')) return 'ts';
            return 'other';
        }

        function updateCounts() {
            const list = window.extractedChannelsList;
            const c = { mpd: 0, m3u8: 0, ts: 0 };
            list.forEach(ch => { const t = getType(ch.url); if (c[t] !== undefined) c[t]++; });
            document.getElementById('cntAll').innerText = list.length;
            document.getElementById('cntMpd').innerText = c.mpd;
            document.getElementById('cntM3u8').innerText = c.m3u8;
            document.getElementById('cntTs').innerText = c.ts;
            document.getElementById('parsedCount').innerText = list.length;
        }

        function setFilter(type) {
            currentFilter = type;
            document.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b.dataset.filter === type));
            renderList();
        }

        function getVisibleIndices() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const out = [];
            window.extractedChannelsList.forEach((ch, i) => {
                if (currentFilter !== 'all' && getType(ch.url) !== currentFilter) return;
                if (q && !ch.name.toLowerCase().includes(q)) return;
                out.push(i);
            });
            return out;
        }

        function navigateChannel(step) {
            const vis = getVisibleIndices();
            if (vis.length === 0) return;
            let pos = vis.indexOf(activeChannelIndex);
            if (pos === -1) pos = step > 0 ? -1 : vis.length;
            pos = (pos + step + vis.length) % vis.length;
            playParsedChannel(vis[pos], true);
        }

        function renderList() {
            const listContainer = document.getElementById('parsedList');
            listContainer.innerHTML = '';

            if (window.extractedChannelsList.length === 0) {
                listContainer.innerHTML = '<div class="empty">لم يتم استخراج قنوات بعد</div>';
                return;
            }

            const vis = getVisibleIndices();
            if (vis.length === 0) {
                listContainer.innerHTML = '<div class="empty">لا توجد نتائج مطابقة</div>';
                return;
            }

            vis.forEach(index => {
                const ch = window.extractedChannelsList[index];
                const card = document.createElement('div');
                card.id = `channelCard_${index}`;
                card.className = "channel-card";
                const hasDRM = ch.k1 && ch.k2;
                const type = getType(ch.url);
                card.title = `${hasDRM ? 'DRM' : 'Free'} • ${type === 'other' ? 'LINK' : type.toUpperCase()}`;

                card.innerHTML = `
                    <div class="ch-name"></div>
                    <div class="ch-btns">
                        <button title="نسخ الرابط" data-act="link"><i class="fa-solid fa-link"></i></button>
                        <button title="نسخ سطر الكود" data-act="code"><i class="fa-solid fa-code"></i></button>
                    </div>
                `;
                card.querySelector('.ch-name').textContent = `${index + 1}. ${ch.name}`;
                card.addEventListener('click', () => playParsedChannel(index));
                card.querySelector('[data-act="link"]').addEventListener('click', (e) => copyToClipboard(ch.url, e));
                card.querySelector('[data-act="code"]').addEventListener('click', (e) => copyCodeLine(index, e));
                listContainer.appendChild(card);
            });
            updateActiveChannelStyle();
        }

        /* ===== المحلل (Parser) كما هو ===== */
        function parseInputText(text) {
            const channels = [];

            function addChannel(name, url, k1 = '', k2 = '') {
                if (!url) return;
                url = url.trim();
                name = (name || '').trim() || `قناة ${channels.length + 1}`;
                k1 = (k1 || '').trim();
                k2 = (k2 || '').trim();

                if (!channels.some(c => c.url === url)) {
                    channels.push({ name, url, k1, k2 });
                }
            }

            // 1. استخراج صيغ M3U / Kodi / EXTVLCOPT / KODIPROP
            if (text.includes('#EXTINF')) {
                const blocks = text.split('#EXTINF');
                blocks.forEach(block => {
                    if (!block.trim()) return;

                    let name = '';
                    const nameMatch = block.match(/,(.+?)(?:\r?\n|$)/);
                    if (nameMatch) {
                        name = nameMatch[1].trim();
                    }

                    let k1 = '', k2 = '';

                    const keyMatch = block.match(/(?:license_key|http-drm-license|inputstream\.adaptive\.license_key)\s*=\s*([a-fA-F0-9]{32}):([a-fA-F0-9]{32})/i)
                                   || block.match(/(?:license_key|http-drm-license|inputstream\.adaptive\.license_key)\s*=\s*([a-fA-F0-9\-_]{20,64}):([a-fA-F0-9\-_]{20,64})/i);

                    if (keyMatch) {
                        k1 = keyMatch[1];
                        k2 = keyMatch[2];
                    } else {
                        const k1Match = block.match(/keyId\s*=\s*["']?([a-fA-F0-9]{32})["']?/i);
                        const k2Match = block.match(/key\s*=\s*["']?([a-fA-F0-9]{32})["']?/i);
                        if (k1Match && k2Match) {
                            k1 = k1Match[1];
                            k2 = k2Match[1];
                        }
                    }

                    const lines = block.split(/\r?\n/);
                    let url = '';
                    for (let line of lines) {
                        line = line.trim();
                        if (line.startsWith('http://') || line.startsWith('https://')) {
                            if (!line.includes('http-drm-license=') && !line.includes('license-key=')) {
                                url = line;
                                break;
                            }
                        }
                    }

                    if (url) {
                        addChannel(name, url, k1, k2);
                    }
                });
            }

            // 2. استخراج أكواد JWPlayer / HTML / JS
            const jwDrmMatches = [...text.matchAll(/["']?file["']?\s*:\s*["'](https?:\/\/[^"'\s]+)["'][\s\S]*?["']?keyId["']?\s*:\s*["']([a-fA-F0-9]{32}|[a-fA-F0-9\-]{20,64})["'][\s\S]*?["']?key["']?\s*:\s*["']([a-fA-F0-9]{32}|[a-fA-F0-9\-]{20,64})["']/gi)];
            jwDrmMatches.forEach(m => {
                addChannel('', m[1], m[2], m[3]);
            });

            // 3. استخراج كائنات JS Objects المعرفة
            const jsObjMatches = [...text.matchAll(/\{[\s\S]*?url\s*:\s*["'](https?:\/\/[^"'\s]+)["'][\s\S]*?\}/gi)];
            jsObjMatches.forEach(m => {
                const str = m[0];
                const u = str.match(/url\s*:\s*["']([^"']+)["']/i);
                const nameM = str.match(/(?:name|id)\s*:\s*["']([^"']+)["']/i);
                const k1M = str.match(/(?:k1|keyId)\s*:\s*["']([^"']+)["']/i);
                const k2M = str.match(/(?:k2|key)\s*:\s*["']([^"']+)["']/i);
                if (u) {
                    addChannel(nameM ? nameM[1] : '', u[1], k1M ? k1M[1] : '', k2M ? k2M[1] : '');
                }
            });

            // 4. استخراج مصفوفات JS
            const arrayObjMatches = [...text.matchAll(/name\s*:\s*["']([^"']+)["']\s*,\s*url\s*:\s*["']([^"']+)["'](?:\s*,\s*k1\s*:\s*["']([^"']+)["'])?(?:\s*,\s*k2\s*:\s*["']([^"']+)["'])?/gi)];
            arrayObjMatches.forEach(m => {
                addChannel(m[1], m[2], m[3] || '', m[4] || '');
            });

            // 5. روابط Kodi المدمجة مباشرة
            const mergedMatches = [...text.matchAll(/license_key=([a-fA-F0-9]{32}):([a-fA-F0-9]{32})(https?:\/\/[^\s"'\)]+)/gi)];
            mergedMatches.forEach(m => {
                addChannel('', m[3], m[1], m[2]);
            });

            // 6. الاحتياطي العام
            if (channels.length === 0) {
                const urls = text.match(/https?:\/\/[^\s"'\)]+/g) || [];
                const validUrls = urls.filter(u => !u.includes('license') && !u.includes('acquire-license'));
                const targetUrls = validUrls.length > 0 ? validUrls : urls;

                const keys = text.match(/([a-fA-F0-9]{32})/g) || [];
                targetUrls.forEach((u, i) => {
                    addChannel(`قناة مكتشفة ${i + 1}`, u, keys[i * 2] || '', keys[i * 2 + 1] || '');
                });
            }

            return channels;
        }

        function parseAndLoadChannels() {
            const rawText = document.getElementById('bulkInput').value;
            if (!rawText.trim()) return;

            window.extractedChannelsList = parseInputText(rawText);
            if (window.extractedChannelsList.length === 0) return;

            activeChannelIndex = -1;
            document.getElementById('searchInput').value = '';
            updateCounts();
            setFilter('all');
        }

        function clearAll() {
            stopPlayer();
            document.getElementById('singleUrl').value = '';
            document.getElementById('singleK1').value = '';
            document.getElementById('singleK2').value = '';
            document.getElementById('bulkInput').value = '';
            document.getElementById('searchInput').value = '';

            window.extractedChannelsList = [];
            activeChannelIndex = -1;
            updateCounts();
            setFilter('all');
        }
    </script>
</body>
</html>
